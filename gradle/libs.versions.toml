[versions]
agp = "9.3.3"
kotlin = "2.4.21"
ksp = "2.3.14"
coreKtx = "1.19.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.1"
activityCompose = "1.13.0"
