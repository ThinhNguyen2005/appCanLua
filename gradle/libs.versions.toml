material3 = "1.5.0"
appcompat = "1.8.0"
# Firebase
firebaseBom = "35.2.0"
firebaseRemoteConfig = "24.0.1"
googleServices = "4.6.0"
firebaseCrashlyticsPlugin = "3.0.8"
firebasePerfPlugin = "2.0.2"
# Play Services
playServicesLocation = "21.4.0"
playServicesMaps = "20.1.0"
# Credentials & Identity
credentials = "1.6.0"
googleid = "1.2.1"
# Coroutines
coroutinesPlayServices = "1.11.0"
# Hilt Work
hiltWork = "1.4.0"
# WorkManager
workRuntimeKtx = "2.12.0"
# Chart (Vico)
vico = "3.3.1"
# Maps Compose
mapsCompose = "9.0.1"
# Accompanist
accompanist = "0.37.3"
# Networking
okhttp = "5.5.1"
gson = "2.15.0"
# Markdown
markwon = "4.6.2"
# Coil
coilCompose = "2.7.0"
# Browser
browser = "1.10.0"
benchmarkTraceprocessor = "1.5.0"
profileinstaller = "1.4.1"
splashscreen = "1.2.0"
# Kotlinx Collections Immutable — PersistentList được Compose Compiler nhận diện natively là Stable
kotlinxCollectionsImmutable = "0.5.2"
securityCrypto = "1.1.0"
# DataStore
datastore = "1.3.0"
# org.json — pure-JVM implementation. Thay thế Android stub
# (org.json.JSONObject trong android.jar là mockable) khi chạy :app:testDebugUnitTest.
# Test-only, không ảnh hưởng production APK.
orgJson = "20260814"
mockk = "1.14.12"
adsMobileSdk = "1.7.0"
userMessagingPlatform = "4.0.0"
detekt = "2.0.0-alpha.6"
composeRules = "0.6.8"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
