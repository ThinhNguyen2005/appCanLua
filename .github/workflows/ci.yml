name: Android CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run TruffleHog Secret Scan (Commit / PR Diff)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --results=verified,unknown

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Create Dummy google-services.json
        run: |
          mkdir -p app
          echo '{"project_info":{"project_number":"12345","project_id":"mock-id","storage_bucket":"mock-bucket"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:123","android_client_info":{"package_name":"com.giathinh.canlua"}},"oauth_client":[{"client_id":"1234567890-dummy.apps.googleusercontent.com","client_type":3}],"api_key":[{"current_key":"mock-key"}],"services":{}}],"configuration_version":"1"}' > app/google-services.json

      - name: Run Detekt & Android Lint
        run: ./gradlew detekt lintDebug --continue --stacktrace

      - name: Upload Static Analysis HTML Reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: static-analysis-reports
          if-no-files-found: ignore
          path: |
            app/build/reports/detekt/detekt.html
            app/build/reports/lint-results-debug.html

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Create Dummy google-services.json
        run: |
          mkdir -p app
          echo '{"project_info":{"project_number":"12345","project_id":"mock-id","storage_bucket":"mock-bucket"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:123","android_client_info":{"package_name":"com.giathinh.canlua"}},"oauth_client":[{"client_id":"1234567890-dummy.apps.googleusercontent.com","client_type":3}],"api_key":[{"current_key":"mock-key"}],"services":{}}],"configuration_version":"1"}' > app/google-services.json

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload Unit Test HTML Report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          if-no-files-found: ignore
          path: app/build/reports/tests/testDebugUnitTest/

  build-debug:
    name: Build Debug APK
    needs: [ static-analysis, unit-test ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Create Dummy google-services.json
        run: |
          mkdir -p app
          echo '{"project_info":{"project_number":"12345","project_id":"mock-id","storage_bucket":"mock-bucket"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:123","android_client_info":{"package_name":"com.giathinh.canlua"}},"oauth_client":[{"client_id":"1234567890-dummy.apps.googleusercontent.com","client_type":3}],"api_key":[{"current_key":"mock-key"}],"services":{}}],"configuration_version":"1"}' > app/google-services.json

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
